name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'build-*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - name: 定位 MSBuild 与工具集
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe" }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "找不到 MSBuild.exe" }
          $ver = & $vswhere -latest -property installationVersion
          $toolset = if ($ver -like '18.*') { 'v145' } else { 'v143' }
          Write-Host "MSBuild  : $msbuild"
          Write-Host "VS 版本  : $ver"
          Write-Host "工具集   : $toolset"
          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT
          "toolset=$toolset" >> $env:GITHUB_OUTPUT

      - name: 构建 Release
        shell: pwsh
        run: |
          & "${{ steps.vs.outputs.msbuild }}" YuanShen-UnlockerLite.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=${{ steps.vs.outputs.toolset }} -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "构建失败，退出码 $LASTEXITCODE" }

      - name: UPX压缩与重新打包
        shell: pwsh
        run: |
          choco install upx --no-progress
          Expand-Archive -Path x64/Release/YuanShen-UnlockerLite.zip -DestinationPath x64/Release/upx_temp
          upx -9 x64/Release/upx_temp/YuanShen-UnlockerLite.dll
          Remove-Item -Force x64/Release/YuanShen-UnlockerLite.zip
          Compress-Archive -Path x64/Release/upx_temp/* -DestinationPath x64/Release/YuanShen-UnlockerLite.zip
          Remove-Item -Recurse -Force x64/Release/upx_temp

      - name: 校验产物
        shell: pwsh
        run: |
          $zip = "x64/Release/YuanShen-UnlockerLite.zip"
          if (-not (Test-Path $zip)) { throw "没有生成 $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try { $names = @($archive.Entries.FullName) } finally { $archive.Dispose() }
          Write-Host ("包内: " + ($names -join ", "))
          foreach ($need in 'YuanShen-UnlockerLite.dll', 'Config.ini') {
            if ($names -notcontains $need) { throw "包里缺少 $need" }
          }
          Write-Host ("大小: {0:N0} 字节" -f (Get-Item $zip).Length)

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: YuanShen-UnlockerLite-${{ github.sha }}
          path: x64/Release/YuanShen-UnlockerLite.zip

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "x64/Release/YuanShen-UnlockerLite.zip" --title "${{ github.ref_name }}" --generate-notes
